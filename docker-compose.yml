services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: evalforge
      POSTGRES_PASSWORD: evalforge
      POSTGRES_DB: evalforge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evalforge"]
      interval: 2s
      timeout: 2s
      retries: 30

  api:
    build:
      context: ./apps/api
    environment:
      EVALFORGE_DB_URL: postgresql+psycopg://evalforge:evalforge@postgres:5432/evalforge
      EVALFORGE_PROVIDER: ${EVALFORGE_PROVIDER:-fake}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EVALFORGE_CLAUDE_MODEL: ${EVALFORGE_CLAUDE_MODEL:-}
      EVALFORGE_API_KEY: ${EVALFORGE_API_KEY:-}
      EVALFORGE_CLAUDE_MAX_CONCURRENCY: ${EVALFORGE_CLAUDE_MAX_CONCURRENCY:-2}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
